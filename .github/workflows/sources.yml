name: Novi izvori (4zida + Nadji Dom)

# Dodatni izvori pored Halo-a. Ne diraju latest_halo_*.json — pune registar.
#
# PRVI RUN NEKA BUDE TEST: pusti sa max_pages = 3 i jednim izvorom, da se
# vidi da direktan requests poziv prolazi i da klasifikacija hvata zgrade,
# pre nego sto se potrosi sat i po na pun prolaz.
#
# Kes: prvi pun run povlaci detaljnu stranicu za svaki oglas (4zida ima
# preko 1.500 u Novom Beogradu). Svaki sledeci cita iz data/cache_*.json
# i traje minut.
#
# 4zida i Nadji Dom NEMAJU anti-bot zastitu (provereno 30.09.2026), pa ne
# trose ScraperAPI kredite — idu direktnim pozivom.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Izvor'
        type: choice
        options: ['4zida', 'nadjidom', 'oba']
        default: '4zida'
      mode:
        description: 'Rezim'
        type: choice
        options: ['prodaja', 'renta', 'oba']
        default: 'renta'
      max_pages:
        description: 'Koliko listing stranica (3 = test, 40 = pun prolaz)'
        default: '3'
      full:
        description: 'Ignorisi kes'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nb-sources
  cancel-in-progress: false

jobs:
  izvori:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalacija zavisnosti
        run: pip install requests beautifulsoup4 lxml

      - name: Stanje registra PRE
        run: |
          python3 - <<'PY'
          import json, glob
          for f in sorted(glob.glob('data/registry_*.json')):
              e = json.load(open(f, encoding='utf-8')).get('entries', {})
              izv = {}
              for x in e.values():
                  for s in x.get('sources', []):
                      izv[s] = izv.get(s, 0) + 1
              print(f"{f}: {len(e)} oglasa | po izvoru: {izv}")
          PY

      - name: Scrape
        run: |
          set -e
          SRC="${{ inputs.source }}"
          MOD="${{ inputs.mode }}"
          MP="${{ inputs.max_pages }}"
          FULL=""
          if [ "${{ inputs.full }}" = "true" ]; then FULL="--full"; fi

          [ "$SRC" = "oba" ] && SOURCES="4zida nadjidom" || SOURCES="$SRC"
          [ "$MOD" = "oba" ] && MODES="prodaja renta" || MODES="$MOD"

          for s in $SOURCES; do
            for m in $MODES; do
              echo "::group::$s / $m"
              python scraper/sources.py --source "$s" --tracker nb --mode "$m" \
                     --max-pages "$MP" $FULL
              echo "::endgroup::"
            done
          done

      - name: Stanje registra POSLE
        run: |
          python3 - <<'PY'
          import json, glob
          for f in sorted(glob.glob('data/registry_*.json')):
              e = json.load(open(f, encoding='utf-8')).get('entries', {})
              izv, visestruki = {}, 0
              for x in e.values():
                  if len(x.get('sources', [])) > 1:
                      visestruki += 1
                  for s in x.get('sources', []):
                      izv[s] = izv.get(s, 0) + 1
              print(f"{f}: {len(e)} oglasa | po izvoru: {izv} "
                    f"| na vise portala: {visestruki}")
          for f in sorted(glob.glob('data/dom_*.json')):
              u = json.load(open(f, encoding='utf-8'))['ukupno']
              print(f"{f}: medijana {u['dom_medijana']} dana "
                    f"({u['n_zavrseni']} skinutih, {u['n_aktivni']} aktivnih)")
          PY

      - name: Commit
        run: |
          git config user.name  "nb-sources-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nema izmena."
            exit 0
          fi
          git commit -m "data: ${{ inputs.source }} ${{ inputs.mode }} [novi izvori]"
          git pull --rebase --autostash origin main
          git push origin main
          echo "Pushano."
